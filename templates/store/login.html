{% extends 'base.html' %}

{% block title %}Sign In — AMBERCAST{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-margin-mobile py-space-xl">
  <div class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-xl p-space-lg md:p-space-xl border border-surface-container-high space-y-space-md">
    <div class="text-center space-y-1">
      <div class="w-12 h-12 rounded-full bg-primary-container/20 border border-primary flex items-center justify-center text-primary font-serif font-bold text-lg mx-auto shadow-sm">
        AC
      </div>
      <h1 class="font-headline-lg text-headline-lg text-on-surface font-serif mt-2">Sign In</h1>
      <p class="font-body-sm text-body-sm text-on-surface-variant">Access your orders, saved wishlist, and account details.</p>
    </div>

    <form method="POST" class="space-y-space-md">
      {% csrf_token %}
      <div>
        <label class="block font-label-md text-label-md uppercase text-on-surface-variant font-semibold mb-1" for="email">Email Address</label>
        {{ form.email }}
      </div>
      <div>
        <label class="block font-label-md text-label-md uppercase text-on-surface-variant font-semibold mb-1" for="password">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="w-full py-3.5 bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md uppercase font-bold tracking-wider rounded shadow-md transition-all">
        Sign In
      </button>
    </form>

    <div class="pt-space-sm border-t border-surface-container text-center text-xs text-on-surface-variant">
      <span>Don't have an account yet?</span>
      <a href="{% url 'register' %}" class="text-primary font-bold hover:underline ml-1 uppercase font-label-sm">Register</a>
    </div>
  </div>
</div>
{% endblock %}
